[project]
name = "llm-redteam"
version = "0.1.0"
description = "Automated red-teaming and safety evaluation harness for LLM-backed applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.11.0",
    "google-genai>=1.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
redteam = "redteam.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["redteam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
